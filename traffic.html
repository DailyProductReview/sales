<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Almost Done - Exklusive Bonus-Welt</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(145deg, #e9eef3 0%, #d4dfeb 100%);
    margin:0;
    padding:24px 20px;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    text-align:center;
    background:rgba(255,255,255,0.98);
    backdrop-filter: blur(0px);
    padding:45px 40px 55px;
    border-radius:48px;
    box-shadow:0 25px 45px rgba(0,0,0,0.2), 0 2px 6px rgba(0,0,0,0.05);
    width:620px;
    max-width:100%;
    transition: all 0.2s ease;
    border: 1px solid rgba(255,255,255,0.5);
}

/* GRÖSSERES LAUFBAND / BANNER – Bildhöhe erhöht & auffälliger */
.marquee-banner {
    background: #0a0f1f;
    background-image: radial-gradient(circle at 10% 20%, rgba(255,215,0,0.12) 2%, transparent 2.5%);
    background-size: 28px 28px;
    padding: 20px 0;
    border-radius: 28px;
    margin-bottom: 36px;
    overflow: hidden;
    white-space: nowrap;
    box-shadow: 0 12px 22px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.1);
    border: 1px solid rgba(255,200,50,0.5);
    cursor: pointer;
}

.marquee-content {
    display: inline-block;
    animation: marquee 22s linear infinite;
    will-change: transform;
}

/* BILDER GRÖSSER: von 80px auf 130px Höhe, Breite proportional */
.marquee-content img {
    height: 130px;
    width: auto;
    margin: 0 18px;
    border-radius: 20px;
    box-shadow: 0 10px 18px rgba(0,0,0,0.4), 0 0 0 3px rgba(255,210,90,0.6);
    vertical-align: middle;
    transition: transform 0.2s ease, box-shadow 0.2s;
    object-fit: cover;
}

.marquee-banner:hover .marquee-content img {
    transform: scale(1.02);
}

/* Laufband-Animation - smooth & etwas langsamer für bessere Sichtbarkeit */
@keyframes marquee {
    0% {
        transform: translateX(0);
    }
    100% {
        transform: translateX(-50%);
    }
}

/* Hover: Pause + Glow-Effekt */
.marquee-banner:hover .marquee-content {
    animation-play-state: paused;
}

.marquee-banner:hover {
    box-shadow: 0 12px 28px rgba(0,0,0,0.5), inset 0 0 8px rgba(255,215,0,0.5);
}

h1{
    font-size:58px;
    margin-bottom:12px;
    background: linear-gradient(135deg, #1E2A5E, #2b3b6e);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    letter-spacing: -0.5px;
    text-shadow: 2px 2px 12px rgba(0,0,0,0.05);
}

.subtitle{
    font-size:28px;
    margin-bottom:32px;
    font-weight: 500;
    color: #1f2b48;
    border-bottom: 2px dashed #ffc107;
    display: inline-block;
    padding-bottom: 8px;
}

input[type="text"]{
    width:100%;
    padding:18px 20px;
    margin-bottom:24px;
    font-size:18px;
    border:2px solid #cfdfed;
    border-radius:60px;
    box-sizing:border-box;
    background:#fff;
    transition: all 0.2s;
    font-weight: 500;
    text-align: center;
    letter-spacing: 0.3px;
}

input[type="text"]:focus {
    border-color: #2f63d6;
    outline: none;
    box-shadow: 0 0 0 4px rgba(47,99,214,0.2);
}

/* AUFFÄLLIGE FARBE ZWISCHEN EMAIL-FELD UND BUTTON */
.highlight-notice {
    background: #ffec9f;
    background: linear-gradient(105deg, #FFE174 0%, #FFD966 100%);
    border-radius: 60px;
    padding: 14px 20px;
    margin-bottom: 28px;
    font-weight: 800;
    font-size: 18px;
    text-align: center;
    color: #a5410f;
    text-shadow: 0 1px 0 rgba(255,255,200,0.8);
    box-shadow: 0 5px 0 #c57f1e;
    border: 1px solid #ffcd7e;
    letter-spacing: 0.6px;
    transition: all 0.15s linear;
    cursor: default;
}

.highlight-notice span {
    background: #222;
    color: #FFD966;
    padding: 4px 12px;
    border-radius: 50px;
    font-size: 15px;
    margin-left: 8px;
    display: inline-block;
    box-shadow: inset 0 1px 0 rgba(0,0,0,0.2), 0 1px 0 rgba(255,255,200,0.6);
}

button{
    width:100%;
    padding:20px 18px;
    font-size:24px;
    font-weight:bold;
    background: #1f4fcf;
    background: linear-gradient(95deg, #1f4fcf, #3a7bd5);
    color:white;
    border:none;
    border-radius:60px;
    cursor:pointer;
    transition: all 0.2s ease;
    box-shadow: 0 8px 18px rgba(0, 50, 100, 0.3);
    letter-spacing: 1px;
}

button:hover{
    background: linear-gradient(95deg, #0f3fb0, #2b6bc5);
    transform: scale(1.01);
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.25);
}

.note{
    margin-top: 32px;
    font-size: 15px;
    color: #3a4a6e;
    background: #f0f5fe;
    padding: 12px;
    border-radius: 40px;
    font-weight: 500;
    backdrop-filter: blur(2px);
}

/* Responsive: bei kleinen Geräten Bilder etwas kleiner, aber immer noch größer als original */
@media (max-width: 550px) {
    .container {
        padding: 30px 20px 40px;
    }
    .marquee-content img {
        height: 95px;
        margin: 0 12px;
    }
    h1 {
        font-size: 44px;
    }
    .subtitle {
        font-size: 22px;
    }
    button {
        font-size: 20px;
        padding: 16px;
    }
    .highlight-notice {
        font-size: 15px;
        padding: 12px 16px;
    }
}

@media (max-width: 450px) {
    .marquee-content img {
        height: 80px;
        margin: 0 8px;
    }
}
</style>
</head>
