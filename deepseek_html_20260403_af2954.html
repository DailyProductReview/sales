<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    background:#f2f2f2;
    margin:0;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    text-align:center;
    background:white;
    padding:60px;
    border-radius:8px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
    width:500px;
    max-width:100%;
}

/* LAUFBAND / BANNER oben */
.marquee-banner {
    background: #1a1a2e;
    padding: 15px 0;
    border-radius: 12px;
    margin-bottom: 30px;
    overflow: hidden;
    white-space: nowrap;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.marquee-content {
    display: inline-block;
    animation: marquee 15s linear infinite;
}

.marquee-content img {
    height: 80px;
    width: auto;
    margin: 0 15px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    vertical-align: middle;
}

/* Laufband-Animation */
@keyframes marquee {
    0% {
        transform: translateX(0);
    }
    100% {
        transform: translateX(-50%);
    }
}

/* Hover: Pause */
.marquee-banner:hover .marquee-content {
    animation-play-state: paused;
}

h1{
    font-size:56px;
    margin-bottom:10px;
}

.subtitle{
    font-size:26px;
    margin-bottom:40px;
}

input[type="text"]{
    width:100%;
    padding:15px;
    margin-bottom:20px;
    font-size:18px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:18px;
    font-size:22px;
    font-weight:bold;
    background:#2f63d6;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#244fb0;
}

.note{
    margin-top:25px;
    font-size:16px;
    color:#333;
}
</style>
</head>
